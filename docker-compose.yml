# docker compose up --build   then open http://localhost:8080
# Needs a .env next to this file with the values from .env.example.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_DB: waypoint
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint"]
      interval: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/waypoint
      DB_PASSWORD: ${DB_PASSWORD}
      DISPATCHER_PASSWORD: ${DISPATCHER_PASSWORD:?Set DISPATCHER_PASSWORD in .env}
      COURIER_PASSWORD: ${COURIER_PASSWORD:?Set COURIER_PASSWORD in .env}
      WAYPOINT_SESSION_KEY: ${WAYPOINT_SESSION_KEY:?Set WAYPOINT_SESSION_KEY in .env}

volumes:
  pgdata:

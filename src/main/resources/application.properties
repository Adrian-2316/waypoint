quarkus.application.name=waypoint

# ---- Database: Postgres; tests use in-memory H2 ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/waypoint}
quarkus.datasource.username=${DB_USER:waypoint}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:waypoint;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# ---- Sign-in: form login with an encrypted, HttpOnly, SameSite=Strict session cookie ----
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.http-only-cookie=true
quarkus.http.auth.form.cookie-same-site=strict
quarkus.http.auth.form.timeout=PT8H
quarkus.http.auth.session.encryption-key=${WAYPOINT_SESSION_KEY}

quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.dispatcher=${DISPATCHER_PASSWORD}
quarkus.security.users.embedded.users.courier=${COURIER_PASSWORD}
quarkus.security.users.embedded.roles.dispatcher=dispatcher
quarkus.security.users.embedded.roles.courier=courier

# No defaults: set these in the environment or in a .env file (see .env.example). Tests get throwaway values.
%test.quarkus.http.auth.session.encryption-key=test-only-session-key-0123456789abcdef
%test.quarkus.security.users.embedded.users.dispatcher=dispatch-test
%test.quarkus.security.users.embedded.users.courier=courier-test

quarkus.http.auth.permission.live.paths=/api/*,/ws/*
quarkus.http.auth.permission.live.policy=authenticated

# ---- Headers ----
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."Permissions-Policy".value=camera=(), microphone=(), geolocation=()

# ---- Simulation ----
waypoint.speed=10
%test.waypoint.auto-tick=false
%test.waypoint.warm-up-minutes=10
